name: Download open-access papers 56-79

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-papers-56-79.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  download:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pypdf

      - name: Download and verify public PDFs
        shell: bash
        run: |
          cat > /tmp/download_papers_56_79.py <<'PY'
          from __future__ import annotations

          import csv
          import io
          import re
          import shutil
          import time
          import zipfile
          from difflib import SequenceMatcher
          from pathlib import Path
          from urllib.parse import quote, urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('papers_56_79')
          shutil.rmtree(OUT, ignore_errors=True)
          OUT.mkdir(exist_ok=True)

          HEADERS = {
              'User-Agent': (
                  'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                  '(KHTML, like Gecko) Chrome/126.0 Safari/537.36 '
                  'OpenAccessPaperCollector/1.2'
              ),
              'Accept': 'application/pdf,text/html,application/xhtml+xml;q=0.9,*/*;q=0.8',
          }

          session = requests.Session()
          retry = Retry(
              total=4,
              connect=4,
              read=4,
              backoff_factor=1.2,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET', 'HEAD'}),
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))

          PAPERS = [
              {
                  'ref': 56,
                  'title': 'STMARL: A Spatio-Temporal Multi-Agent Reinforcement Learning Approach for Cooperative Traffic Light Control',
                  'doi': '10.1109/TMC.2020.3033782',
                  'arxiv': '1908.10577',
              },
              {
                  'ref': 57,
                  'title': 'DynSTGAT: Dynamic Spatial-Temporal Graph Attention Network for Traffic Signal Control',
                  'doi': '10.1145/3459637.3482254',
              },
              {
                  'ref': 58,
                  'title': 'How Attentive are Graph Attention Networks?',
                  'arxiv': '2105.14491',
                  'candidates': [
                      'https://openreview.net/pdf?id=F72ximsx7C1',
                  ],
              },
              {
                  'ref': 59,
                  'title': 'EGAT: Edge-Featured Graph Attention Network',
                  'doi': '10.1007/978-3-030-86362-3_21',
              },
              {
                  'ref': 60,
                  'title': 'A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning',
                  'candidates': [
                      'https://proceedings.mlr.press/v15/ross11a/ross11a.pdf',
                  ],
              },
              {
                  'ref': 61,
                  'title': 'A Graph Deep Reinforcement Learning Traffic Signal Control for Multiple Intersections Considering Missing Data',
                  'doi': '10.1109/TVT.2024.3444475',
              },
              {
                  'ref': 62,
                  'title': 'Traffic Signal Timing via Deep Reinforcement Learning',
                  'candidates': [
                      'https://www.ieee-jas.com/fileZDHXBEN/journal/article/zdhxbywb/2016/3/PDF/20160303.pdf',
                      'https://www.ieee-jas.net/en/article/pdf/preview/10.1109/JAS.2016.7508798',
                  ],
              },
              {
                  'ref': 63,
                  'title': 'A Deep Reinforcement Learning Network for Traffic Light Cycle Control',
                  'doi': '10.1109/TVT.2018.2890726',
                  'candidates': [
                      'https://ieeexplore.ieee.org/ielaam/25/8640274/8600382-aam.pdf',
                  ],
              },
              {
                  'ref': 64,
                  'title': 'Dueling Double Deep Q-Network for Adaptive Traffic Signal Control with Low Exhaust Emissions in a Single Intersection',
              },
              {
                  'ref': 65,
                  'title': 'Intelligent Traffic Signal Control with Deep Reinforcement Learning at Single Intersection',
                  'doi': '10.1145/3467707.3467767',
              },
              {
                  'ref': 66,
                  'title': 'Deep Deterministic Policy Gradient for Traffic Signal Control of Single Intersection',
                  'doi': '10.1109/CCDC.2019.8832406',
              },
              {
                  'ref': 67,
                  'title': 'IntelliLight: A Reinforcement Learning Approach for Intelligent Traffic Light Control',
                  'doi': '10.1145/3219819.3220096',
                  'candidates': [
                      'https://faculty.ist.psu.edu/jessieli/Publications/2018-KDD-IntelliLight.pdf',
                  ],
              },
              {
                  'ref': 68,
                  'title': 'Vehicle-Level Fairness-Oriented Constrained Multi-Agent Reinforcement Learning for Adaptive Traffic Signal Control',
                  'doi': '10.1109/TITS.2025.3544223',
              },
              {
                  'ref': 69,
                  'title': 'Learning Phase Competition for Traffic Signal Control',
                  'doi': '10.1145/3357384.3357900',
                  'arxiv': '1905.04722',
              },
              {
                  'ref': 70,
                  'title': 'CROSS: A Mixture-of-Experts Reinforcement Learning Framework for Generalizable Large-Scale Traffic Signal Control',
                  'arxiv': '2603.24930',
              },
              {
                  'ref': 71,
                  'title': 'A Spatial-Temporal Graph Attention Network for Multi-Intersection Traffic Light Control',
                  'doi': '10.1109/IJCNN52387.2021.9533335',
              },
              {
                  'ref': 72,
                  'title': 'Meta-Learning Based Spatial-Temporal Graph Attention Network for Traffic Signal Control',
                  'doi': '10.1016/j.knosys.2022.109166',
              },
              {
                  'ref': 73,
                  'title': 'A Deep Reinforcement Learning Framework with Memory Network to Coordinate Traffic Signal Control',
                  'doi': '10.1109/ITSC55140.2022.9921752',
              },
              {
                  'ref': 74,
                  'title': 'Multi-Agent Reinforcement Learning Based on Representational Communication for Large-Scale Traffic Signal Control',
                  'doi': '10.1109/ACCESS.2023.3275883',
                  'arxiv': '2310.02435',
              },
              {
                  'ref': 75,
                  'title': 'Traffic Light Control Using Deep Policy-Gradient and Value-Function-Based Reinforcement Learning',
                  'doi': '10.1049/iet-its.2017.0153',
                  'arxiv': '1704.08883',
              },
              {
                  'ref': 76,
                  'title': 'Learning Traffic Signal Control from Demonstrations',
                  'doi': '10.1145/3357384.3358079',
                  'arxiv': '1904.08117',
              },
              {
                  'ref': 77,
                  'title': 'Time Critic Policy Gradient Methods for Traffic Signal Control in Complex and Congested Scenarios',
                  'doi': '10.1145/3292500.3330988',
              },
              {
                  'ref': 78,
                  'title': 'MetaLight: Value-Based Meta-Reinforcement Learning for Traffic Signal Control',
                  'doi': '10.1609/aaai.v34i01.5467',
                  'candidates': [
                      'https://ojs.aaai.org/index.php/AAAI/article/download/5467/5323',
                  ],
              },
              {
                  'ref': 79,
                  'title': 'A Novel Reinforcement Learning-Based Cooperative Traffic Signal System Through Max-Pressure Control',
                  'doi': '10.1109/TVT.2021.3069921',
              },
          ]

          STOPWORDS = {
              'a', 'an', 'and', 'are', 'as', 'at', 'based', 'by', 'for', 'from',
              'in', 'of', 'on', 'the', 'to', 'toward', 'towards', 'using', 'with',
              'via', 'network', 'learning', 'control', 'traffic', 'signal'
          }

          def normalize(text: str) -> str:
              return re.sub(r'[^a-z0-9]+', ' ', text.lower()).strip()

          def title_tokens(text: str) -> set[str]:
              return {
                  token for token in normalize(text).split()
                  if len(token) >= 4 and token not in STOPWORDS
              }

          def title_similarity(left: str, right: str) -> float:
              return SequenceMatcher(None, normalize(left), normalize(right)).ratio()

          def safe_name(ref: int, title: str) -> str:
              cleaned = re.sub(r'[^A-Za-z0-9]+', '_', title).strip('_')
              return f'{ref:02d}_{cleaned[:112]}.pdf'

          def looks_like_pdf(data: bytes) -> bool:
              return len(data) > 10_000 and data.lstrip()[:5] == b'%PDF-'

          def pdf_matches_title(data: bytes, expected_title: str) -> tuple[bool, str]:
              try:
                  reader = PdfReader(io.BytesIO(data), strict=False)
                  text_parts: list[str] = []
                  metadata = reader.metadata
                  if metadata and metadata.title:
                      text_parts.append(str(metadata.title))
                  for page in reader.pages[:3]:
                      try:
                          text_parts.append(page.extract_text() or '')
                      except Exception:
                          continue
                  extracted = ' '.join(text_parts)
                  if not extracted.strip():
                      return True, 'PDF valid; title text unavailable'

                  expected = title_tokens(expected_title)
                  observed = title_tokens(extracted[:18000])
                  overlap = len(expected & observed) / max(1, len(expected))
                  similarity = title_similarity(expected_title, extracted[:500])
                  ok = overlap >= 0.55 or similarity >= 0.52
                  return ok, f'title overlap={overlap:.2f}, similarity={similarity:.2f}'
              except Exception as exc:
                  return True, f'PDF valid; metadata check unavailable: {type(exc).__name__}'

          def extract_pdf_links(html: str, base_url: str) -> list[str]:
              soup = BeautifulSoup(html, 'html.parser')
              links: list[str] = []
              for key in (
                  'citation_pdf_url', 'eprints.document_url',
                  'wkhealth_pdf_url', 'pdf_url'
              ):
                  node = soup.find('meta', attrs={'name': key})
                  if node and node.get('content'):
                      links.append(urljoin(base_url, node['content']))
              for node in soup.find_all('meta'):
                  prop = (node.get('property') or '').lower()
                  if prop in {'og:pdf', 'pdf_url'} and node.get('content'):
                      links.append(urljoin(base_url, node['content']))
              for node in soup.find_all('a', href=True):
                  href = node['href']
                  text = node.get_text(' ', strip=True).lower()
                  lower = href.lower()
                  if (
                      lower.endswith('.pdf')
                      or '/pdf/' in lower
                      or 'download' in lower
                      or text in {'pdf', 'download pdf', 'view pdf'}
                  ):
                      links.append(urljoin(base_url, href))
              return list(dict.fromkeys(links))

          def fetch_candidate(
              url: str,
              expected_title: str,
              depth: int = 0,
          ) -> tuple[bytes | None, str, str]:
              if depth > 1:
                  return None, url, 'HTML recursion limit'
              try:
                  response = session.get(
                      url,
                      headers=HEADERS,
                      timeout=70,
                      allow_redirects=True,
                  )
                  content = response.content
                  content_type = response.headers.get('content-type', '').lower()

                  if response.status_code >= 400:
                      return None, response.url, f'HTTP {response.status_code}'

                  if looks_like_pdf(content):
                      matches, note = pdf_matches_title(content, expected_title)
                      if matches:
                          return content, response.url, f'PDF verified; {note}'
                      return None, response.url, f'PDF title mismatch; {note}'

                  is_html = (
                      'html' in content_type
                      or content.lstrip().startswith(b'<!DOCTYPE')
                      or b'<html' in content[:500].lower()
                  )
                  if is_html:
                      html = content.decode('utf-8', errors='ignore')
                      for link in extract_pdf_links(html, response.url)[:18]:
                          pdf, final_url, note = fetch_candidate(
                              link,
                              expected_title,
                              depth + 1,
                          )
                          if pdf:
                              return pdf, final_url, note
                      return None, response.url, 'HTML without matching downloadable PDF'

                  return None, response.url, f'Not PDF ({content_type or "unknown type"})'
              except Exception as exc:
                  return None, url, f'{type(exc).__name__}: {exc}'

          def discover_doi(title: str) -> str | None:
              try:
                  response = session.get(
                      'https://api.crossref.org/works',
                      params={
                          'query.title': title,
                          'rows': 6,
                          'select': 'DOI,title',
                      },
                      headers=HEADERS,
                      timeout=30,
                  )
                  items = response.json().get('message', {}).get('items', [])
                  best_doi = None
                  best_score = 0.0
                  for item in items:
                      candidate_title = ' '.join(item.get('title') or [])
                      score = title_similarity(title, candidate_title)
                      if score > best_score and item.get('DOI'):
                          best_score = score
                          best_doi = item['DOI']
                  if best_score >= 0.70:
                      return best_doi
              except Exception:
                  pass
              return None

          def openalex_candidates(title: str, doi: str | None) -> list[str]:
              urls: list[str] = []
              try:
                  if doi:
                      endpoint = f'https://api.openalex.org/works/https://doi.org/{doi}'
                      data = session.get(endpoint, headers=HEADERS, timeout=30).json()
                      works = [data]
                  else:
                      data = session.get(
                          'https://api.openalex.org/works',
                          params={'search': title, 'per-page': 7},
                          headers=HEADERS,
                          timeout=30,
                      ).json()
                      works = [
                          work for work in (data.get('results') or [])
                          if title_similarity(title, work.get('title') or '') >= 0.68
                      ]

                  for work in works:
                      locations = [
                          work.get('best_oa_location'),
                          work.get('primary_location'),
                      ]
                      locations.extend(work.get('locations') or [])
                      for location in locations:
                          if not location:
                              continue
                          if location.get('pdf_url'):
                              urls.append(location['pdf_url'])
                          if location.get('landing_page_url'):
                              urls.append(location['landing_page_url'])
              except Exception:
                  pass
              return list(dict.fromkeys(urls))

          def unpaywall_candidates(doi: str) -> list[str]:
              urls: list[str] = []
              try:
                  encoded = quote(doi, safe='')
                  data = session.get(
                      f'https://api.unpaywall.org/v2/{encoded}?email=paper-downloader@example.com',
                      headers=HEADERS,
                      timeout=30,
                  ).json()
                  locations = [data.get('best_oa_location')]
                  locations.extend(data.get('oa_locations') or [])
                  for location in locations:
                      if not location:
                          continue
                      for key in ('url_for_pdf', 'url'):
                          if location.get(key):
                              urls.append(location[key])
              except Exception:
                  pass
              return list(dict.fromkeys(urls))

          def semantic_scholar_candidates(title: str, doi: str | None) -> list[str]:
              urls: list[str] = []
              try:
                  if doi:
                      encoded = quote(doi, safe='')
                      endpoint = (
                          'https://api.semanticscholar.org/graph/v1/paper/'
                          f'DOI:{encoded}?fields=title,openAccessPdf,url'
                      )
                      results = [session.get(endpoint, headers=HEADERS, timeout=30).json()]
                  else:
                      data = session.get(
                          'https://api.semanticscholar.org/graph/v1/paper/search',
                          params={
                              'query': title,
                              'limit': 5,
                              'fields': 'title,openAccessPdf,url',
                          },
                          headers=HEADERS,
                          timeout=30,
                      ).json()
                      results = [
                          item for item in (data.get('data') or [])
                          if title_similarity(title, item.get('title') or '') >= 0.68
                      ]
                  for result in results:
                      oa = result.get('openAccessPdf') or {}
                      if oa.get('url'):
                          urls.append(oa['url'])
              except Exception:
                  pass
              return list(dict.fromkeys(urls))

          rows: list[dict[str, str]] = []

          for paper in PAPERS:
              ref = int(paper['ref'])
              title = str(paper['title'])
              filename = safe_name(ref, title)
              output = OUT / filename

              candidates: list[str] = list(paper.get('candidates', []))
              arxiv_id = paper.get('arxiv')
              if arxiv_id:
                  candidates.extend([
                      f'https://arxiv.org/pdf/{arxiv_id}.pdf',
                      f'https://export.arxiv.org/pdf/{arxiv_id}',
                  ])

              doi = paper.get('doi') or discover_doi(title)
              doi_text = str(doi) if doi else None

              candidates.extend(openalex_candidates(title, doi_text))
              candidates.extend(semantic_scholar_candidates(title, doi_text))
              if doi_text:
                  candidates.extend(unpaywall_candidates(doi_text))
                  candidates.append(f'https://doi.org/{doi_text}')

              candidates = list(dict.fromkeys(candidates))
              downloaded = False
              attempts: list[str] = []

              print(f'\n[{ref}] {title}')
              if doi_text:
                  print(f'  DOI: {doi_text}')

              for candidate in candidates:
                  print(f'  Trying {candidate}')
                  pdf, final_url, note = fetch_candidate(candidate, title)
                  attempts.append(f'{candidate} -> {note}')
                  if pdf:
                      output.write_bytes(pdf)
                      rows.append({
                          'reference': str(ref),
                          'title': title,
                          'status': 'downloaded',
                          'filename': filename,
                          'source_url': final_url,
                          'bytes': str(len(pdf)),
                          'notes': f'{note}; DOI={doi_text or "not found"}',
                      })
                      downloaded = True
                      print(f'  Downloaded {len(pdf):,} bytes from {final_url}')
                      break
                  time.sleep(0.35)

              if not downloaded:
                  rows.append({
                      'reference': str(ref),
                      'title': title,
                      'status': 'not downloaded',
                      'filename': '',
                      'source_url': '',
                      'bytes': '0',
                      'notes': (
                          ('DOI=' + doi_text + ' | ' if doi_text else '')
                          + ' | '.join(attempts)[-3000:]
                      ),
                  })
                  print('  No lawful public PDF retrieved.')

          status_file = Path('download_status_56_79.csv')
          with status_file.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      'reference', 'title', 'status', 'filename',
                      'source_url', 'bytes', 'notes',
                  ],
              )
              writer.writeheader()
              writer.writerows(rows)

          downloaded_rows = [row for row in rows if row['status'] == 'downloaded']
          failed_rows = [row for row in rows if row['status'] != 'downloaded']

          readme = [
              '# Traffic Papers - References 56-79',
              '',
              f'Downloaded and PDF-verified: **{len(downloaded_rows)} of {len(rows)}** references.',
              '',
              '## Downloaded files',
              '',
          ]
          for row in downloaded_rows:
              readme.append(
                  f"- **{int(row['reference']):02d}** - "
                  f"[{row['title']}](papers_56_79/{row['filename']})"
              )
          if failed_rows:
              readme.extend(['', '## Not retrieved automatically', ''])
              for row in failed_rows:
                  readme.append(
                      f"- **{int(row['reference']):02d}** - {row['title']}"
                  )
          readme.extend([
              '',
              'Only openly available publisher copies, institutional manuscripts, '
              'and public preprints were attempted.',
          ])
          Path('README_56_79.md').write_text(
              '\n'.join(readme) + '\n',
              encoding='utf-8',
          )

          zip_path = Path('Traffic_Papers_References_56-79.zip')
          with zipfile.ZipFile(
              zip_path,
              'w',
              compression=zipfile.ZIP_DEFLATED,
          ) as archive:
              for pdf in sorted(OUT.glob('*.pdf')):
                  archive.write(pdf, pdf.name)
              archive.write(status_file)
              archive.write('README_56_79.md')

          print(f'\nCreated {zip_path} with {len(downloaded_rows)} verified PDFs.')
          PY

          python /tmp/download_papers_56_79.py

      - name: Commit downloaded papers and ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers_56_79 README_56_79.md download_status_56_79.csv Traffic_Papers_References_56-79.zip
          if git diff --cached --quiet; then
            echo 'No new files to commit.'
          else
            git commit -m 'Add open-access papers 56-79 by reference number'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Traffic-Papers-References-56-79
          path: |
            Traffic_Papers_References_56-79.zip
            download_status_56_79.csv
          if-no-files-found: error
          retention-days: 7
