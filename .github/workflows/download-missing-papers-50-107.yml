name: Download missing lawful papers 50-107

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-missing-papers-50-107.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  download:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pypdf

      - name: Download and verify missing public PDFs
        shell: bash
        run: |
          cat > /tmp/download_missing_50_107.py <<'PY'
          from __future__ import annotations

          import csv
          import io
          import re
          import shutil
          import subprocess
          import tempfile
          import time
          import zipfile
          from difflib import SequenceMatcher
          from pathlib import Path
          from urllib.parse import quote, urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path("missing_papers_50_107")
          shutil.rmtree(OUT, ignore_errors=True)
          OUT.mkdir(exist_ok=True)

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/126.0 Safari/537.36 "
                  "OpenAccessPaperCollector/2.1"
              ),
              "Accept": (
                  "application/pdf,text/html,application/xhtml+xml;"
                  "q=0.9,*/*;q=0.8"
              ),
          }

          session = requests.Session()
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=1.4,
              status_forcelist=(408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({"GET", "HEAD"}),
          )
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.mount("http://", HTTPAdapter(max_retries=retry))

          PAPERS = [
              {
                  "ref": 57,
                  "title": (
                      "DynSTGAT: Dynamic Spatial-Temporal Graph Attention "
                      "Network for Traffic Signal Control"
                  ),
                  "doi": "10.1145/3459637.3482254",
                  "arxiv": "2109.05491",
              },
              {
                  "ref": 59,
                  "title": "EGAT: Edge-Featured Graph Attention Network",
                  "doi": "10.1007/978-3-030-86362-3_21",
                  "candidates": [
                      "https://link.springer.com/content/pdf/10.1007/978-3-030-86362-3_21.pdf",
                      "https://link.springer.com/chapter/10.1007/978-3-030-86362-3_21",
                  ],
              },
              {
