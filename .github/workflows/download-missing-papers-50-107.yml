                      "https://cronfa.swansea.ac.uk/Record/cronfa64123",
                  ],
              },
              {
                  "ref": 92,
                  "title": (
                      "An Experimental Review of Reinforcement Learning "
                      "Algorithms for Adaptive Traffic Signal Control"
                  ),
                  "doi": "10.1007/978-3-319-25808-9_4",
                  "candidates": [
                      "https://link.springer.com/content/pdf/10.1007/978-3-319-25808-9_4.pdf",
                      "https://link.springer.com/chapter/10.1007/978-3-319-25808-9_4",
                      "https://research.universityofgalway.ie/en/publications/an-experimental-review-of-reinforcement-learning-algorithms-for-a-6/",
