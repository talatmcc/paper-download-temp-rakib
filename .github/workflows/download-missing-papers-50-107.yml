                      "https://jas.ia.ac.cn/fileZDHXBEN/journal/article/zdhxbywb/2016/3/PDF/20160303.pdf",
                      "https://www.ieee-jas.com/article/id/c5bdbe80-d3b0-4a3d-b34e-1420cf2f77cd",
                  ],
              },
